name: Build and Push AI Conformance Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  image-build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      # - name: Run E2E tests
      #   run: |
      #     make test-e2e

      # - name: Run E2E tests via hydrophone
      #   run: |
      #     make test-hydrophone

      # - name: Run E2E tests via Sonobuoy
      #   run: |
      #     make test-sonobuoy

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          make image-push IMAGE_REGISTRY=ghcr.io/${{ github.repository_owner }}
